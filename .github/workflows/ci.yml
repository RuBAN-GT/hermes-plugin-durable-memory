name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: durable_memory
          POSTGRES_PASSWORD: durable_memory
          POSTGRES_DB: durable_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable_memory -d durable_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . ruff
      - run: python -m unittest discover -s tests -v
        env:
          DURABLE_MEMORY_TEST_DATABASE_URL: postgresql://durable_memory:durable_memory@127.0.0.1:5432/durable_memory_test
      - run: ruff check .
      - run: ruff format --check .
